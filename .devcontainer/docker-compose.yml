services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://security_analyst:security_analyst@db:5432/security_analyst
      AUTH_ENABLED: "false"
      ENABLE_API_DOCS: "true"
      RATE_LIMIT_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: security_analyst
      POSTGRES_USER: security_analyst
      POSTGRES_PASSWORD: security_analyst
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_analyst -d security_analyst"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - devcontainer_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://security_analyst:security_analyst@db:5432/security_analyst
      AUTH_ENABLED: "false"
      ENABLE_API_DOCS: "true"
      RATE_LIMIT_ENABLED: "false"
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: >
      sh -c "npm install --no-package-lock &&
             npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    volumes:
      - ..:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  devcontainer_postgres_data:
  frontend_node_modules:
