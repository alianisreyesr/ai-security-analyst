name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Ruff
        run: ruff check backend/app backend/tests

      - name: Tests and coverage gate
        working-directory: backend
        run: >-
          pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Type check
        working-directory: backend
        run: mypy app

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and security tools
        run: python -m pip install -e "./backend[dev]"

      - name: Dependency vulnerability audit
        run: pip-audit --progress-spinner off

      - name: Static security analysis
        run: bandit -q -r backend/app

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: security_analyst
          POSTGRES_USER: security_analyst
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security_analyst -d security_analyst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://security_analyst:ci_test_password@localhost:5432/security_analyst

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e ./backend

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Verify database tables
        run: >-
          python -c "import os;
          from sqlalchemy import create_engine, inspect;
          engine=create_engine(os.environ['DATABASE_URL']);
          tables=inspect(engine).get_table_names();
          assert 'security_events' in tables;
          assert 'threats' in tables;
          assert 'threat_analyses' in tables;
          assert 'ip_reputation_cache' in tables;
          assert 'analytics_snapshots' in tables;
          assert 'security_cases' in tables;
          assert 'threat_reviews' in tables"

  docker-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend container
        run: docker build -t ai-security-analyst-backend:test ./backend

      - name: Verify hardened runtime package versions
        run: >-
          docker run --rm ai-security-analyst-backend:test
          python -c "from importlib.metadata import version;
          assert tuple(map(int, version('msgpack').split('.')[:3])) >= (1, 2, 1);
          assert tuple(map(int, version('setuptools').split('.')[:2])) >= (78, 1);
          print('msgpack=' + version('msgpack'));
          print('setuptools=' + version('setuptools'))"

      - name: Scan repository filesystem
        run: >-
          docker run --rm
          -v "$PWD:/workspace:ro"
          aquasec/trivy:0.74.0
          fs --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL /workspace

      - name: Scan backend container
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore:/workspace/.trivyignore:ro"
          aquasec/trivy:0.74.0
          image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          --ignorefile /workspace/.trivyignore
          ai-security-analyst-backend:test

  release-readiness:
    name: Release readiness
    if: always()
    needs:
      - test
      - security-audit
      - postgres-migration
      - docker-security
    runs-on: ubuntu-latest

    steps:
      - name: Verify all critical checks passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security-audit.result }}
          MIGRATION_RESULT: ${{ needs.postgres-migration.result }}
          DOCKER_SECURITY_RESULT: ${{ needs.docker-security.result }}
        run: |
          for result in             "$TEST_RESULT"             "$SECURITY_AUDIT_RESULT"             "$MIGRATION_RESULT"             "$DOCKER_SECURITY_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "Release readiness blocked: critical job result is $result"
              exit 1
            fi
          done
          echo "Release readiness gate passed."
