name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Ruff
        run: ruff check backend/app backend/tests

      - name: Tests
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: security_analyst
          POSTGRES_USER: security_analyst
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security_analyst -d security_analyst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://security_analyst:ci_test_password@localhost:5432/security_analyst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e ./backend

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Verify security_events table
        run: >-
          python -c "import os;
          from sqlalchemy import create_engine, inspect;
          engine=create_engine(os.environ['DATABASE_URL']);
          assert 'security_events' in inspect(engine).get_table_names()"

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend container
        run: docker build -t ai-security-analyst-backend:test ./backend
