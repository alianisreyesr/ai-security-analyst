name: Release Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate version and tracked files
        run: |
          python scripts/check_version.py
          tracked="$(git ls-files)"
          if echo "$tracked" | grep -E '(^|/)(\.env|id_rsa|id_ed25519|credentials\.json)$'; then
            exit 1
          fi
      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          APP_ENV: test
        run: |
          pip install -e ".[dev]"
          pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Package source and checksum
        run: |
          version="$(cat VERSION)"
          mkdir release
          git archive --format=tar.gz --prefix="ai-security-analyst-${version}/" --output="release/ai-security-analyst-${version}.tar.gz" HEAD
          cd release
          sha256sum "ai-security-analyst-${version}.tar.gz" > SHA256SUMS
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-analyst-release-candidate
          path: release/
