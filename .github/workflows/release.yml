name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate semantic version
        id: version
        run: |
          python scripts/check_version.py
          echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Reject tracked secret files
        run: |
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|credentials\.json)$'; then
            echo "A common secret-bearing filename is tracked." >&2
            exit 1
          fi

      - name: Test backend release gate
        working-directory: backend
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          APP_ENV: test
        run: |
          pip install -e ".[dev]"
          pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Package source
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir release
          git archive --format=tar.gz --prefix="ai-security-analyst-${VERSION}/" --output="release/ai-security-analyst-${VERSION}.tar.gz" HEAD
          cd release
          sha256sum "ai-security-analyst-${VERSION}.tar.gz" > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ai-security-analyst-${{ steps.version.outputs.value }}
          path: release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "AI Security Analyst $tag" --notes-file "docs/releases/${tag}.md" "release/ai-security-analyst-${VERSION}.tar.gz" "release/SHA256SUMS"
