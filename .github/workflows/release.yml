name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate version
        id: version
        run: |
          python scripts/check_version.py
          echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Reject tracked secret files
        run: |
          tracked="$(git ls-files)"
          if echo "$tracked" | grep -E '(^|/)(\.env|id_rsa|id_ed25519|credentials\.json)$'; then
            exit 1
          fi
      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          APP_ENV: test
        run: |
          pip install -e ".[dev]"
          pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Package source
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir release
          git archive --format=tar.gz --prefix="ai-security-analyst-${VERSION}/" --output="release/ai-security-analyst-${VERSION}.tar.gz" HEAD
          cd release
          sha256sum "ai-security-analyst-${VERSION}.tar.gz" > SHA256SUMS
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-analyst-${{ steps.version.outputs.value }}
          path: release/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "AI Security Analyst $tag" --notes-file "docs/releases/${tag}.md" "release/ai-security-analyst-${VERSION}.tar.gz" "release/SHA256SUMS"
          fi
